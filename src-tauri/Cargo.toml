[package]
name = "flowboard"
version = "1.10.0"
description = "FlowBoard — local-first project management"
authors = ["Pedro"]
edition = "2021"
default-run = "flowboard"

[lib]
name = "flowboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "io-std", "time"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
schemars = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync"] }
